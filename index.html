<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>SYSTEM_FAILURE // ADITYA MOD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

:root {
  --blood: #8b0000;
  --bright-red: #ff0033;
  --static-white: #e6e6e6;
  --dark-bg: #030000;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--dark-bg);
  color: var(--static-white);
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
  user-select: none;
}

/* Persistent HUD Watermark on Every Screen */
#hud-watermark {
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 150;
  font-weight: bold;
  font-size: clamp(10px, 2.5vw, 13px);
  color: var(--bright-red);
  letter-spacing: 3px;
  text-shadow: 0 0 8px rgba(255, 0, 51, 0.7);
  pointer-events: none;
  opacity: 0.85;
  background: rgba(0, 0, 0, 0.5);
  padding: 4px 10px;
  border: 1px solid rgba(255, 0, 51, 0.35);
  box-shadow: 0 0 10px rgba(139, 0, 0, 0.4);
}

/* CRT Distortions */
#screen {
  position: absolute;
  inset: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 16px;
  background: #000;
}

#scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.7) 50%),
              linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  background-size: 100% 3px, 6px 100%;
}

#vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 51;
  background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.95) 90%);
}

#blood-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 40;
  background: radial-gradient(circle, transparent 60%, rgba(139, 0, 0, 0.4) 100%);
  opacity: 0;
  transition: opacity 0.3s;
}

#cam-feed {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 320px;
  height: 320px;
  border-radius: 50%;
  opacity: 0;
  z-index: 10;
  filter: contrast(250%) grayscale(100%) brightness(40%) invert(10%);
  pointer-events: none;
  mix-blend-mode: screen;
  transition: opacity 1.5s ease-in;
}

#terminal {
  position: relative;
  z-index: 20;
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column-reverse;
  font-size: clamp(12px, 3.4vw, 15px);
  line-height: 1.35;
  text-shadow: 0 0 4px rgba(255, 255, 255, 0.3);
  margin-top: 10px;
}

.line {
  white-space: pre-wrap;
  word-break: break-all;
  margin-bottom: 2px;
}
.red { color: var(--bright-red); text-shadow: 0 0 8px var(--bright-red); font-weight: bold; }
.blood { color: var(--blood); font-weight: bold; }
.dim { color: #555; }
.whisper { color: #777; font-style: italic; font-size: 0.9em; }

/* Subliminal Jump Flashes */
#jumpscare {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 100;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#skull-art {
  font-family: monospace;
  white-space: pre;
  color: var(--bright-red);
  font-size: clamp(8px, 1.8vw, 12px);
  line-height: 1;
  text-shadow: 0 0 15px var(--bright-red);
}

.scare-watermark {
  color: var(--blood);
  letter-spacing: 5px;
  font-weight: bold;
  font-size: 1.1rem;
  margin-top: 15px;
  text-shadow: 0 0 12px var(--bright-red);
}

#status-bar {
  position: relative;
  z-index: 25;
  border-bottom: 1px solid #330000;
  padding-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
  padding-right: 140px; /* Room for HUD watermark */
}

#rec-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--bright-red);
  font-weight: bold;
}

#rec-dot {
  width: 10px;
  height: 10px;
  background: var(--bright-red);
  border-radius: 50%;
  animation: pulse 0.7s infinite alternate;
}

#timer {
  font-size: 1.2rem;
  letter-spacing: 2px;
  color: var(--bright-red);
  font-weight: bold;
}

#noise {
  position: fixed;
  inset: 0;
  z-index: 45;
  pointer-events: none;
  opacity: 0.08;
}

@keyframes pulse {
  0% { opacity: 0.2; transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1.1); }
}

body.violent-shake {
  animation: vshake 0.05s infinite;
}
@keyframes vshake {
  0% { transform: translate(-3px, 2px) skewX(2deg); filter: invert(20%); }
  50% { transform: translate(3px, -2px) skewX(-2deg); }
  100% { transform: translate(-2px, -3px); }
}

#start-curtain {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 200;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
}

#start-curtain h1 {
  font-size: 2.2rem;
  color: var(--bright-red);
  letter-spacing: 6px;
  margin-bottom: 8px;
  text-shadow: 0 0 10px var(--bright-red);
}

.mod-tag {
  color: var(--bright-red);
  font-weight: bold;
  letter-spacing: 4px;
  font-size: 0.95rem;
  margin-bottom: 12px;
  text-shadow: 0 0 10px rgba(255, 0, 51, 0.6);
}

#start-curtain p {
  color: #666;
  font-size: 0.85rem;
  margin-bottom: 28px;
}

#init-btn {
  background: transparent;
  border: 1px solid var(--bright-red);
  color: var(--bright-red);
  padding: 16px 42px;
  font-family: inherit;
  font-size: 1.1rem;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
}
</style>
</head>
<body>

<div id="hud-watermark">&#9760; ADITYA MOD</div>

<canvas id="noise"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="blood-overlay"></div>
<video id="cam-feed" autoplay playsinline muted></video>

<div id="jumpscare">
  <pre id="skull-art"></pre>
  <div class="scare-watermark">[ ADITYA MOD // INTERCEPT ]</div>
</div>

<div id="screen">
  <div id="status-bar">
    <div id="rec-indicator"><div id="rec-dot"></div> FEED: ADITYA MOD</div>
    <div id="timer">03:00</div>
  </div>

  <div id="terminal"></div>
</div>

<div id="start-curtain">
  <div class="mod-tag">&#9670; ADITYA MOD EXCLUSIVE &#9670;</div>
  <h1>SIGNAL INTERCEPT</h1>
  <p>AUDIO & SENSORS REQUIRED. PUT HEADPHONES ON.</p>
  <button id="init-btn">ESTABLISH UPLINK</button>
</div>

<script>
(() => {
'use strict';

const RUN_TIME = 180;
let timeLeft = RUN_TIME;
const term = document.getElementById('terminal');
const timerEl = document.getElementById('timer');
const camFeed = document.getElementById('cam-feed');
const bloodOverlay = document.getElementById('blood-overlay');
const jumpscare = document.getElementById('jumpscare');
const skullArt = document.getElementById('skull-art');

const DEMON_FACE = `
                   .---.
                 /       \\
                |  () ()  |
                 \\   ^   /
                  |||||||
              .-------------..
             /   ADITYA MOD   \\
            /   YOU BREATHE    \\
           |                    |
           |  I AM IN THE WIRES |
            \\                  /
             '----------------'
`;

const SKULL_STARE = `
            .ed"""" """$$$$be.
          -"           ^""**$$$e.
        ."                   '$$$c
       /                      "4$$b
      d  0                      0$$
      $  *                   .$$$$$$
     .$  ^c    ADITYA MOD    $$$$$$$.
     d$L  4.         4$$$$$$$$$$$$$$b
     $$$$b ^ceeeee.  4$$ECL.F*$$$$$$$
 e$""=. $$$$$$d$$$$$$$d  $$$$$$$d$$$$$$$P
 $---   *$$$$$$$$$$$$$$  "$$$$$$$###$$$"
         "$$$C***$$$$*"    "$$$$$$$$$$"
          ^r" =*""         '$$$$$$$$$P
           '                 "$$$$$$P
`;

let ctx = null;

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  startSubBassDrone();
}

function startSubBassDrone() {
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(32, ctx.currentTime);

  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(35.5, ctx.currentTime);

  gain.gain.setValueAtTime(0.18, ctx.currentTime);

  osc.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc2.start();
}

function playHeartbeat() {
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(55, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 0.18);

  gain.gain.setValueAtTime(0.7, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.2);

  setTimeout(() => {
    if (!ctx) return;
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(45, ctx.currentTime);
    osc2.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.25);
    gain2.gain.setValueAtTime(0.6, ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.start();
    osc2.stop(ctx.currentTime + 0.26);
  }, 220);
}

function playStabStatic(duration = 0.3) {
  if (!ctx) return;
  const n = Math.floor(ctx.sampleRate * duration);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1);

  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.4, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

  src.connect(gain);
  gain.connect(ctx.destination);
  src.start();
}

function ttsWhisper(text, pitch = 0.1, rate = 0.65) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = pitch;
    u.rate = rate;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

function logLine(text, cls = '') {
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  d.textContent = text;
  term.insertBefore(d, term.firstChild);
  while (term.children.length > 40) term.removeChild(term.lastChild);
}

function triggerFlash(art, ms = 220) {
  skullArt.textContent = art;
  jumpscare.style.display = 'flex';
  document.body.classList.add('violent-shake');
  playStabStatic(ms / 1000);
  try { if (navigator.vibrate) navigator.vibrate([100, 50, 150]); } catch(e) {}

  setTimeout(() => {
    jumpscare.style.display = 'none';
    document.body.classList.remove('violent-shake');
  }, ms);
}

const noiseCanvas = document.getElementById('noise');
const nctx = noiseCanvas.getContext('2d');
function resizeNoise() {
  noiseCanvas.width = window.innerWidth / 3;
  noiseCanvas.height = window.innerHeight / 3;
}
window.addEventListener('resize', resizeNoise);
resizeNoise();

function renderNoise() {
  const imgData = nctx.createImageData(noiseCanvas.width, noiseCanvas.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const val = Math.random() * 255;
    d[i] = val; d[i+1] = val; d[i+2] = val; d[i+3] = 255;
  }
  nctx.putImageData(imgData, 0, 0);
  requestAnimationFrame(renderNoise);
}
requestAnimationFrame(renderNoise);

async function activateCameraTrap() {
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      camFeed.srcObject = stream;
      camFeed.style.opacity = '0.35';
    }
  } catch(err) {
    camFeed.style.opacity = '0.15';
  }
}

const TIMELINE = [
  { at: 175, act: () => logLine("[ADITYA MOD] Intercepting baseband transceiver...", "dim") },
  { at: 168, act: () => logLine("[ADITYA MOD] Fingerprint bound: 0x88F-CORRUPT", "dim") },
  { at: 160, act: () => {
      logLine("! DEVICE SERIAL OVERWRITTEN BY ADITYA MOD", "blood");
      playHeartbeat();
    }
  },
  { at: 152, act: () => {
      logLine("> Extracting telemetry...", "dim");
      ttsWhisper("I hear you breathing.");
    }
  },
  { at: 145, act: () => logLine("[ADITYA MOD] DO NOT CLOSE THIS WINDOW.", "red") },
  { at: 135, act: () => {
      activateCameraTrap();
      logLine(">> OPTICAL SENSOR OVERRIDE INITIATED", "red");
      triggerFlash(DEMON_FACE, 120);
    }
  },
  { at: 125, act: () => {
      logLine("I CAN SEE YOUR FACE.", "red");
      bloodOverlay.style.opacity = '0.4';
      ttsWhisper("I see you.");
    }
  },
  { at: 115, act: () => {
      logLine("Why aren't you blinking?", "whisper");
      playHeartbeat();
    }
  },
  { at: 105, act: () => {
      triggerFlash(SKULL_STARE, 200);
      logLine("[ADITYA MOD] CORRUPTION AT 0x000000DEAD", "blood");
    }
  },
  { at: 95, act: () => {
      logLine("Your battery cannot stop this.", "whisper");
      ttsWhisper("Look behind you.");
    }
  },
  { at: 80, act: () => {
      document.body.classList.add('violent-shake');
      setTimeout(() => document.body.classList.remove('violent-shake'), 1200);
      bloodOverlay.style.opacity = '0.7';
      logLine("! [ADITYA MOD] SYSTEM EXHAUSTION IMMINENT", "red");
    }
  },
  { at: 65, act: () => {
      triggerFlash(DEMON_FACE, 300);
      logLine("THERE IS NO OPERATING SYSTEM LEFT.", "red");
      ttsWhisper("You cannot leave.");
    }
  },
  { at: 50, act: () => {
      logLine("DELETING RESTORE SECTORS: 100%", "blood");
      camFeed.style.filter = "contrast(300%) invert(100%) brightness(80%)";
    }
  },
  { at: 35, act: () => {
      triggerFlash(SKULL_STARE, 350);
      logLine("EVERY WINDOW IN YOUR HOUSE IS OPEN.", "red");
      playHeartbeat();
    }
  },
  { at: 20, act: () => {
      document.body.classList.add('violent-shake');
      logLine("00:20 - RECOVERY KEY SHREDDED [ADITYA MOD]", "red");
      ttsWhisper("Ten seconds.");
    }
  },
  { at: 10, act: () => {
      triggerFlash(DEMON_FACE, 500);
      logLine("HOST ABANDONED. PERMANENT REWRITE.", "blood");
    }
  },
  { at: 3, act: () => {
      triggerFlash(SKULL_STARE, 800);
      ttsWhisper("Goodbye.");
    }
  }
];

function runTerminalGlitch() {
  if (timeLeft <= 0) return;
  const hex = "0x" + Math.floor(Math.random() * 0xFFFFFF).toString(16).toUpperCase();
  const glitches = [
    `[ADITYA MOD] READ_FAULT: ${hex}`,
    `CORRUPTION_VECTOR: ${hex} INJECTED`,
    `>> ADITYA MOD OCCUPYING SECTOR ${hex}`,
    `[ADITYA MOD TRACE] CAPTURED: ${Math.floor(Math.random()*9000)+1000} bytes`,
    `LISTENING...`,
    `DON'T LOOK AWAY`
  ];
  const msg = glitches[Math.floor(Math.random() * glitches.length)];
  logLine(msg, Math.random() > 0.8 ? "blood" : "dim");

  if (Math.random() > 0.85) playHeartbeat();
  setTimeout(runTerminalGlitch, Math.floor(150 + Math.random() * 450));
}

function startExperience() {
  initAudio();
  document.getElementById('start-curtain').style.display = 'none';

  const clock = setInterval(() => {
    timeLeft--;
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

    const match = TIMELINE.find(ev => ev.at === timeLeft);
    if (match) match.act();

    if (timeLeft <= 0) {
      clearInterval(clock);
      flatline();
    }
  }, 1000);

  runTerminalGlitch();
}

function flatline() {
  term.innerHTML = '';
  camFeed.style.opacity = '0';
  document.body.classList.remove('violent-shake');
  bloodOverlay.style.opacity = '1';
  logLine("[ADITYA MOD] SIGNAL PERMANENTLY TERMINATED.", "blood");
  logLine("DEVICE ENCRYPTION FAILED.", "dim");
  playStabStatic(2.0);
}

document.getElementById('init-btn').addEventListener('click', startExperience);
})();
</script>
</body>
</html>
