<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL OVERRIDE // 03:00</title>
<style>
  :root {
    --bg-color: #020402;
    --text-green: #00ff41;
    --text-dim: #008f11;
    --alert-red: #ff3333;
    --cyan-accent: #00ffff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-green);
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* CRT Scanline & Glow Overlay */
  body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 10;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
  }

  /* Header Bar */
  header {
    height: 50px;
    border-bottom: 2px solid var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-weight: bold;
    background: #000c00;
  }

  .status-tag {
    color: var(--alert-red);
    animation: blink 0.8s infinite alternate;
  }

  #timer {
    color: var(--cyan-accent);
    font-size: 1.2rem;
    letter-spacing: 2px;
  }

  /* Main Workspace */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: 1fr 140px;
    gap: 10px;
    padding: 10px;
    overflow: hidden;
  }

  .panel {
    border: 1px solid var(--text-dim);
    background: rgba(0, 10, 0, 0.6);
    padding: 10px;
    position: relative;
    overflow: hidden;
  }

  .panel-title {
    position: absolute;
    top: 4px;
    right: 8px;
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* Logs Stream */
  #log-stream {
    overflow-y: hidden;
    display: flex;
    flex-direction: column-reverse;
    font-size: 0.9rem;
    line-height: 1.4;
  }

  .log-line {
    white-space: pre;
    text-shadow: 0 0 3px var(--text-green);
  }
  .log-red { color: var(--alert-red); text-shadow: 0 0 4px var(--alert-red); }
  .log-cyan { color: var(--cyan-accent); }

  /* Hex Memory Matrix */
  #hex-dump {
    font-size: 0.8rem;
    line-height: 1.25;
    color: var(--text-dim);
    overflow: hidden;
  }

  /* Bottom Visuals */
  #progress-panel {
    grid-column: span 2;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }

  .meter-container {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .meter-label {
    width: 220px;
    font-size: 0.85rem;
  }

  .meter-track {
    flex: 1;
    height: 14px;
    border: 1px solid var(--text-dim);
    position: relative;
    background: #000;
  }

  .meter-fill {
    height: 100%;
    width: 0%;
    background-color: var(--text-green);
    box-shadow: 0 0 8px var(--text-green);
    transition: width 0.2s linear;
  }

  /* Start Screen Overlay */
  #boot-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  button {
    background: transparent;
    border: 2px solid var(--text-green);
    color: var(--text-green);
    font-family: inherit;
    font-size: 1.2rem;
    padding: 14px 28px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
    letter-spacing: 2px;
  }

  button:hover {
    background: var(--text-green);
    color: #000;
  }

  @keyframes blink {
    from { opacity: 1; }
    to { opacity: 0.2; }
  }
</style>
</head>
<body>

<div id="boot-overlay">
  <div style="font-size: 1.5rem; letter-spacing: 3px;">TERMINAL INTERFACE INITIALIZATION</div>
  <p style="color: #666;">Audio synthesis requires user activation.</p>
  <button id="start-btn">INITIALIZE RUN (03:00)</button>
</div>

<header>
  <div>NODE: <span class="log-cyan">SEC-TERMINAL-0x49</span></div>
  <div class="status-tag">[EXECUTION IN PROGRESS]</div>
  <div id="timer">03:00</div>
</header>

<main>
  <div class="panel" id="log-stream">
    <div class="panel-title">// EVENT_BUFFER</div>
  </div>

  <div class="panel" id="hex-dump">
    <div class="panel-title">// RAW_STREAM</div>
  </div>

  <div class="panel" id="progress-panel">
    <div class="panel-title">// SYSTEM_INSTRUMENTATION</div>
    
    <div class="meter-container">
      <div class="meter-label">OVERALL SIMULATION</div>
      <div class="meter-track">
        <div id="total-progress" class="meter-fill"></div>
      </div>
      <span id="total-pct">0%</span>
    </div>

    <div class="meter-container">
      <div class="meter-label">NODE COMPILATION</div>
      <div class="meter-track">
        <div id="stage-progress" class="meter-fill" style="background-color: var(--cyan-accent); box-shadow: 0 0 8px var(--cyan-accent);"></div>
      </div>
      <span id="stage-pct">0%</span>
    </div>
  </div>
</main>

<script>
  const DURATION_SECONDS = 180; // Exactly 3 minutes
  let remainingTime = DURATION_SECONDS;
  let audioCtx = null;
  let timerInterval = null;

  // Sound Engine (Web Audio API Synthesizer)
  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playTone(freq, duration, type = 'square', volume = 0.03) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function sfxKeystroke() {
    const freq = 600 + Math.random() * 800;
    playTone(freq, 0.04, 'square', 0.02);
  }

  function sfxAlert() {
    playTone(440, 0.15, 'sawtooth', 0.05);
    setTimeout(() => playTone(330, 0.25, 'sawtooth', 0.05), 100);
  }

  function sfxSuccess() {
    playTone(880, 0.08, 'sine', 0.04);
    setTimeout(() => playTone(1320, 0.12, 'sine', 0.04), 80);
  }

  // Animation Elements
  const logStream = document.getElementById('log-stream');
  const hexDump = document.getElementById('hex-dump');
  const timerDisplay = document.getElementById('timer');
  const totalBar = document.getElementById('total-progress');
  const totalPct = document.getElementById('total-pct');
  const stageBar = document.getElementById('stage-progress');
  const stagePct = document.getElementById('stage-pct');

  const logTemplates = [
    () => `[${new Date().toISOString().slice(11, 23)}] CONNECTED: 192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}:443`,
    () => `[${new Date().toISOString().slice(11, 23)}] VERIFYING: SHA256-${Array.from({length: 8}, () => Math.floor(Math.random()*16).toString(16)).join('')}`,
    () => `[${new Date().toISOString().slice(11, 23)}] BYPASSING GATEWAY RULE: #0x${Math.floor(Math.random()*4096).toString(16).toUpperCase()}`,
    () => `[${new Date().toISOString().slice(11, 23)}] ALLOCATING MEMORY BLOCK [${Math.floor(Math.random()*8192)} KB]`,
    () => `[${new Date().toISOString().slice(11, 23)}] ROUTING PACKETS: INTERFACE ETH-${Math.floor(Math.random()*4)}`,
    () => `[${new Date().toISOString().slice(11, 23)}] DECRYPTING DATA PAYLOAD STREAM...`
  ];

  function addLog(text, className = '') {
    const el = document.createElement('div');
    el.className = 'log-line ' + className;
    el.textContent = text;
    logStream.insertBefore(el, logStream.firstChild);
    
    // Cap lines in memory
    while (logStream.children.length > 50) {
      logStream.removeChild(logStream.lastChild);
    }
  }

  // Update Raw Memory Grid
  function updateHex() {
    let str = "";
    for (let i = 0; i < 22; i++) {
      let offset = "0x" + (i * 16).toString(16).padStart(4, '0').toUpperCase();
      let bytes = Array.from({length: 8}, () => Math.floor(Math.random()*256).toString(16).padStart(2, '0').toUpperCase()).join(' ');
      str += `${offset}  ${bytes}\n`;
    }
    hexDump.textContent = str;
  }

  // Execution Sequence Loop
  function startTerminal() {
    // Timer Countdown
    timerInterval = setInterval(() => {
      remainingTime--;
      
      const mins = Math.floor(remainingTime / 60);
      const secs = remainingTime % 60;
      timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      // Global Progress
      const elapsed = DURATION_SECONDS - remainingTime;
      const pct = Math.floor((elapsed / DURATION_SECONDS) * 100);
      totalBar.style.width = pct + "%";
      totalPct.textContent = pct + "%";

      // Cycling Phase Progress
      const stage = (elapsed % 30) / 30;
      const stageP = Math.floor(stage * 100);
      stageBar.style.width = stageP + "%";
      stagePct.textContent = stageP + "%";

      if (remainingTime <= 0) {
        clearInterval(timerInterval);
        completeSequence();
      }
    }, 1000);

    // Fast-paced terminal text generator
    function stepLog() {
      if (remainingTime <= 0) return;

      const rand = Math.random();
      if (rand > 0.88) {
        addLog(`[CRITICAL] RUNTIME ANOMALY DETECTED AT SECTOR 0x${Math.floor(Math.random()*9999).toString(16)}`, 'log-red');
        sfxAlert();
      } else if (rand > 0.70) {
        addLog(`>> HANDSHAKE CONFIRMED ON PORT ${Math.floor(1000 + Math.random()*8000)}`, 'log-cyan');
        sfxSuccess();
      } else {
        const template = logTemplates[Math.floor(Math.random() * logTemplates.length)];
        addLog(template());
        if (Math.random() > 0.4) sfxKeystroke();
      }

      setTimeout(stepLog, Math.floor(60 + Math.random() * 200));
    }

    stepLog();

    // Hex refresh
    setInterval(() => {
      if (remainingTime > 0) updateHex();
    }, 120);
  }

  function completeSequence() {
    addLog("[COMPLETE] OVERRIDE ROUTINE FINALIZED - ALL DATA TRANSMITTED", 'log-cyan');
    sfxSuccess();
    document.querySelector('.status-tag').textContent = "[SIMULATION COMPLETE]";
    document.querySelector('.status-tag').style.color = "var(--text-green)";
  }

  // Trigger initiation via button to satisfy audio policy
  document.getElementById('start-btn').addEventListener('click', () => {
    initAudio();
    document.getElementById('boot-overlay').style.display = 'none';
    startTerminal();
  });
</script>
</body>
</html>
